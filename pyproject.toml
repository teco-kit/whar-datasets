[project]
name = "whar-datasets"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "kaggle>=1.6.17",
    "pandas>=2.2.3",
    "python-dotenv>=1.0.1",
    "pyarrow>=20.0.0",
    "pywavelets>=1.8.0",
    "scipy>=1.15.3",
    "tqdm>=4.67.1",
    "playwright>=1.60.0",
    "pydantic>=2.13.4",
    "requests>=2.32.5",
    "numpy>=2.3.5",
]


[project.optional-dependencies]
dev = [
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.7",
    "jupyter>=1.1.1",
    "pandas-stubs>=2.2.3.250527",
    "types-tqdm>=4.67.0.20250516",
    "pytest>=8.0.0",
    "torch>=2.7.1",
    "matplotlib>=3.10.9",
]
torch = [
    "torch>=2.7.1",
]
plot = [
    "matplotlib>=3.10.9",
]
tf = [
    "tensorflow>=2.20.0",
    "types-tensorflow>=2.18.0.20250516",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
